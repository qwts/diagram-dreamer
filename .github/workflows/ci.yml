name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default for every job: check out, build, test, write nothing. A job that
# needs more asks for it at its own call site, where the ask is visible in
# review — `codeql` below is the only one that does, and only for the SARIF
# upload. This is CodeQL's actions/missing-workflow-permissions, and the reason
# a compromised build step cannot push a commit.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Advanced CodeQL, invoked from the governed CI lifecycle rather than run by
  # GitHub's default setup (ENG-0149). Default setup runs as the
  # `github-advanced-security[bot]` actor, which cannot be named in the
  # repository Actions Policy — scanned, but outside the lifecycle the policy
  # exists to constrain. The analysis lives in its own reusable workflow so the
  # permissions it needs stay contained to this one call.
  codeql:
    name: code scanning
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  static:
    name: types, lint, tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `packageManager` in the root package.json pins the version; this action
      # reads it rather than taking one here, so there is a single source.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Formatting
        run: pnpm run format:check
      - name: Token contrast (WCAG 2.1 AA, both themes)
        run: pnpm run check:contrast
      # SPEC §9: design.md lint catches broken token references. It exits
      # non-zero only on errors; the orphaned-token warnings are expected while
      # DESIGN.md's `components:` block covers a subset of the system.
      - name: design.md lint
        run: npx --yes @google/design.md lint DESIGN.md

  # Every host, not just the one that happens to be primary. SPEC §4 says
  # Electron is not a prerequisite for running Vellum, and a gate that only ever
  # built `apps/desktop` could not tell the difference between that being true
  # and nobody having checked.
  build:
    name: build is a static SPA (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [desktop, web]
    env:
      # Where this host's build output lives. The shell and core are libraries
      # under packages/ and emit nothing.
      HOST_DIR: apps/${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vellum/${{ matrix.host }} build
      # Neither host has a server: the desktop renderer loads from file:// and
      # the web host is served as files. If a server or worker entry ever
      # reappears in the output, that invariant has been broken.
      - name: No server or worker bundle
        run: |
          if find "$HOST_DIR/dist" -name '_worker*' -o -name 'server*' -o -name 'nitro*' | grep -q .; then
            echo "::error::build emitted a server/worker bundle; every host must be a static SPA"
            find "$HOST_DIR/dist" -name '_worker*' -o -name 'server*' -o -name 'nitro*'
            exit 1
          fi
      # The app must run fully offline. Fonts and i18n are bundled; nothing may
      # be fetched at runtime.
      #
      # Two kinds of match are not evidence of a fetch, and are filtered out:
      #   - documentation and XML-namespace URLs baked into vendor error
      #     messages and SVG attributes
      #   - loopback, which is by definition not an external origin. TanStack
      #     Router carries `http://localhost` as the fallback it assigns to
      #     `router.origin` when `window.origin` is null — a placeholder for
      #     URL parsing, never a request target.
      - name: No external origins in the bundle
        run: |
          if grep -rInoE 'https?://[a-zA-Z0-9.-]+' "$HOST_DIR/dist/assets" \
             | grep -vE 'react\.dev|react\.i18next\.com|tailwindcss\.com|www\.w3\.org|json-schema\.org' \
             | grep -vE '//(localhost|127\.0\.0\.1)' \
             | grep . ; then
            echo "::error::built bundle references an external origin"
            exit 1
          fi
      # The diagram sandbox is the one document we ship that is *meant* to hold
      # third-party code, so a URL grep is the wrong gate for it: Mermaid's
      # dependencies carry documentation links in their error messages, and none
      # of them are fetches. What makes them unreachable is the policy, so the
      # policy is what gets asserted — a self-contained document that cannot
      # load anything, with its one script pinned by hash.
      - name: Diagram sandbox is self-contained and locked down
        run: |
          SANDBOX="$HOST_DIR/dist/sandbox.html"
          test -f "$SANDBOX" || { echo "::error::$SANDBOX was not built"; exit 1; }
          # The whole policy, matched exactly, with only the script hash free to
          # vary. Deliberately brittle: `grep -q "default-src 'none'"` would
          # still pass if a CDN were appended to script-src, and this document
          # is the one place in the tree where third-party code executes.
          EXPECTED="content=\"default-src 'none'; script-src 'sha256-[A-Za-z0-9+/=]+'; style-src 'unsafe-inline'; img-src data:; font-src data:\""
          grep -qE "$EXPECTED" "$SANDBOX" || {
            echo "::error::sandbox CSP is not the expected locked-down policy"
            grep -o 'content="default-src[^\"]*"' "$SANDBOX" || true
            exit 1
          }

      # Phase 3 moved the tree under apps/. If a build ever writes to the old
      # repo-root location again, the move has been half-undone.
      - name: Build output stays inside the host package
        run: |
          if [ -e dist ] || [ -e dist-pseudo ]; then
            echo "::error::build wrote to the repo root; output belongs in $HOST_DIR"
            exit 1
          fi

  # The same specs, from packages/shell, against each host's own build. This is
  # the gate that makes "the shell is host-neutral" checkable: a change that
  # quietly assumes Electron passes under `desktop` and fails under `web`.
  e2e:
    name: render, axe, RTL, pseudo-localization (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [desktop, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vellum/${{ matrix.host }} exec playwright install --with-deps chromium
      - name: Playwright gates
        run: pnpm --filter @vellum/${{ matrix.host }} test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.host }}
          path: apps/${{ matrix.host }}/playwright-report/
          retention-days: 7
